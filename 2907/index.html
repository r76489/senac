<!DOCTYPE html>

<html>

<head>
    <title>Spotify</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="https://www.scdn.co/i/_global/favicon.png" data-next-head="" />
</head>

<body>
    <header>
        <div>
            <img src="https://img.icons8.com/ios11/512/FFFFFF/spotify.png" id="logo">
        </div>
        <div>
            <h1>Olá de novo</h1>
        </div>
    </header>

    <section>
        <div id="loginOptions">
            <div id="emailarea">
                <label for="mensagem">E-mail</label>
                <textarea id="mensagem" rows="3.9" cols="42"></textarea>
            </div>
            <div id="botaocontinuar">
                <p id="continuar">Continuar</p>
            </div>
            
            <p id="ou">ou</p>

            <div id="telefone">
                <button><img src="mobile_2_24dp_FFFFFF_FILL0_wght400_GRAD0_opsz24.png">
                    Continuar com um número de telefone</button>
            </div>
            <div id="google">
                <button><img src="google-logo.png">
                    Continuar com o Google</button>
            </div>
            <div id="facebook">
                <button><img
                        src="facebook-circle-logo-icon-fb-app-transparent-background-premium-social-media-design-for-digital-download-free-png.webp">
                    Continuar com o Facebook</button>
            </div>
            <div id="apple">
                <button><img src="Apple_logo_white.svg.webp">
                    Continuar com a Apple</button>
            </div>
            <p id="nao">Não tem uma conta?</p>
            <p id="inscrever">Inscrever-se</p>
        </div>
    </section>

    <footer>
        <p id="foot">Este site é protegido pelo reCAPTCHA e está sujeito à <br>
            Política de Privacidade e aos Termos de Serviço do Google.</p>
    </footer>

</body>


</html>
