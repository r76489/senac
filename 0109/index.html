<!DOCTYPE html>

<html>

<head>
    <title>Calculadora do Garfield</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="icon" href="img/images - Editado.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
</head>

<body>
    <section class="carrossel slides">
        <section id="calculator__section" class="slide">
            <section>
                <h1 id="result">Resultado</h1>
            </section>

            <section id="input__section">
                <input type="number" id="numb1" class="input">
                <p>e</p>
                <input type="number" id="numb2" class="input">
            </section>

            <section>
                <div id="button__section">
                    <button class="button" id="button__add">Somar</button>
                    <button class="button" id="button__subtract">Subtrair</button>
                    <button class="button" id="button__multiply">Multiplicar</button>
                    <button class="button" id="button__divide">Dividir</button>
                </div>

                <img src="img/images - Editado.png" alt="Pelucia Garfield">
            </section>
        </section>

        <script src="script.js"></script>

</body>

</html>
